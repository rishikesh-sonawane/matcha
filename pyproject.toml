[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.bandit]
exclude_dirs = ["tests", "venv", ".git", ".github"]
skips = ["B101", "B404", "B603", "B607"]
targets = ["ai.py", "config.py", "main.py", "matcher.py", "profile.py", "scrapers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
