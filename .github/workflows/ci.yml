name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      # fail-fast: false — one failing Python version must not cancel the
      # others (a single failure used to hide all downstream breakage).
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]  # F-03: dev venv is 3.14

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pin lint tools to the same versions as the local venv and the
          # .pre-commit-config.yaml revs (Session 24). An unpinned `pip install
          # ruff` drifted to 0.16.1, whose formatter rewrites Python code fences
          # inside markdown docs (kilo.md, revamp/*.md) — CI failed while the
          # pinned 0.15.16 passed locally. bandit/pre-commit are pinned for the
          # same reproducibility reason.
          pip install ruff==0.15.16 bandit==1.9.4 pre-commit==4.6.0
          pip install -r requirements.txt
          pip install -e .

      - name: Lint
        # Scoped to the actual codebase: formatting markdown code fences in
        # planning docs is not part of the gate (and drifts across ruff revs).
        run: ruff check src tests

      - name: Format check
        run: ruff format --diff src tests

      - name: Static analysis
        run: bandit -c pyproject.toml -r src/matcha -lll

      - name: Pre-commit check
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Unit tests
        # F-02: the full suite — previously only tests.test_core ever ran in CI
        run: python -m unittest discover tests -v

      - name: Coverage gate (>=80%)
        run: |
          pip install pytest-cov==7.1.0  # pinned: reproducible coverage
          python -m pytest tests -q --cov=src/matcha --cov-report=term
          python -m coverage report --fail-under=80

  build:
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller==6.20.0  # pinned: reproducible builds
          pip install -r requirements.txt
          pip install -e .

      - name: Build executable
        run: pyinstaller --onefile --name matcha "$(command -v matcha)"

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: matcha-executable
          path: dist/matcha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save container image
        run: docker image save ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} | gzip > matcha-image.tar.gz

      - name: Upload container image
        uses: actions/upload-artifact@v4
        with:
          name: matcha-container
          path: matcha-image.tar.gz

  # Stage 3 (TBD) will go here

  # Stage 4 (TBD) will go here
